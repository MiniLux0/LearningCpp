name: LearningCpp Quality & CI Matrix

on:
  push:
    branches:
      - main
    paths:
      - "0*/**"
      - "1*/**"
      - "utils/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "🐧 Linux (Ubuntu · GCC C++17)"
            os: ubuntu-latest
          - name: "🪟 Windows (MinGW-w64 C++17)"
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Compiler Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++

      - name: Verify Compiler
        run: |
          g++ --version

      - name: Run Course Standards, Pedagogy & Compilation Auditor
        run: |
          python utils/scripts/audit_module.py --completed
