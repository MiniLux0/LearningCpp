name: LearningCpp Quality & CI Matrix

on:
  push:
    branches:
      - main
    paths:
      - "0*/**"
      - "1*/**"
      - "utils/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "🐧 Linux (Ubuntu · GCC C++17)"
            os: ubuntu-latest
          - name: "🪟 Windows (MinGW-w64 C++17)"
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Compiler Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++

      - name: Verify Compiler
        run: |
          g++ --version

      - name: Run Course Standards & Pedagogy Auditor
        run: |
          python utils/scripts/audit_module.py --completed

      - name: Compile Verification (All Labs, Demos & Solutions)
        shell: bash
        run: |
          echo "Compilando todo el código C++ con banderas estrictas (-std=c++17 -Wall -Wextra -Wpedantic)..."
          FAILURES=0
          TOTAL=0
          
          # Buscar archivos .cpp en módulos completados
          for f in $(find 0[1-5]_* -name "*.cpp" ! -path "*/demos/D07_HiddenInfiniteLoopBug.cpp" ! -path "*/demos/D05_CinInfiniteLoopBug.cpp"); do
            ((TOTAL++))
            echo "-> Compilando: $f"
            if ! g++ -std=c++17 -Wall -Wextra -Wpedantic -c "$f" -o /dev/null; then
              echo "❌ Error de compilación en: $f"
              ((FAILURES++))
            fi
          done
          
          echo "================================================================="
          echo "Resultado de compilación: $TOTAL archivos procesados, $FAILURES fallos."
          echo "================================================================="
          
          if [ $FAILURES -ne 0 ]; then
            exit 1
          fi
