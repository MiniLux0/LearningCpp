<svg width="600" height="480" xmlns="http://www.w3.org/2000/svg">
<rect width="600" height="480" fill="#ffffff" rx="10"/>
<style>
    text { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }
    .frame { stroke-width: 2; rx: 8; }
    .call-text { font-size: 16px; font-weight: bold; fill: #343a40; }
    .sub-text { font-size: 14px; fill: #495057; }
    .ret-text { font-size: 16px; fill: #d32f2f; font-weight: bold; }

    @keyframes appear-3 {
        0%, 0.0% { opacity: 0; }
        0.0%, 99.0% { opacity: 1; }
        100.0%, 100% { opacity: 0; }
    }
    .g-3 { animation: appear-3 16.0s infinite; opacity: 0; }

    @keyframes color-3 {
        0%, 86.5% { fill: #f8f9fa; stroke: #dee2e6; }
        87.5%, 100% { fill: #d4edda; stroke: #28a745; }
    }
    .rect-3 { animation: color-3 16.0s infinite; fill: #f8f9fa; stroke: #dee2e6; }

    @keyframes text-math-3 {
        0%, 86.5% { opacity: 1; }
        87.5%, 100% { opacity: 0; }
    }
    .math-3 { animation: text-math-3 16.0s infinite; opacity: 1; }

    @keyframes text-ret-3 {
        0%, 86.5% { opacity: 0; }
        87.5%, 100% { opacity: 1; }
    }
    .ret-3 { animation: text-ret-3 16.0s infinite; opacity: 0; }

    @keyframes appear-2 {
        0%, 11.5% { opacity: 0; }
        12.5%, 86.5% { opacity: 1; }
        87.5%, 100% { opacity: 0; }
    }
    .g-2 { animation: appear-2 16.0s infinite; opacity: 0; }

    @keyframes color-2 {
        0%, 74.0% { fill: #f8f9fa; stroke: #dee2e6; }
        75.0%, 100% { fill: #d4edda; stroke: #28a745; }
    }
    .rect-2 { animation: color-2 16.0s infinite; fill: #f8f9fa; stroke: #dee2e6; }

    @keyframes text-math-2 {
        0%, 74.0% { opacity: 1; }
        75.0%, 100% { opacity: 0; }
    }
    .math-2 { animation: text-math-2 16.0s infinite; opacity: 1; }

    @keyframes text-ret-2 {
        0%, 74.0% { opacity: 0; }
        75.0%, 100% { opacity: 1; }
    }
    .ret-2 { animation: text-ret-2 16.0s infinite; opacity: 0; }

    @keyframes appear-1 {
        0%, 24.0% { opacity: 0; }
        25.0%, 74.0% { opacity: 1; }
        75.0%, 100% { opacity: 0; }
    }
    .g-1 { animation: appear-1 16.0s infinite; opacity: 0; }

    @keyframes color-1 {
        0%, 61.5% { fill: #f8f9fa; stroke: #dee2e6; }
        62.5%, 100% { fill: #d4edda; stroke: #28a745; }
    }
    .rect-1 { animation: color-1 16.0s infinite; fill: #f8f9fa; stroke: #dee2e6; }

    @keyframes text-math-1 {
        0%, 61.5% { opacity: 1; }
        62.5%, 100% { opacity: 0; }
    }
    .math-1 { animation: text-math-1 16.0s infinite; opacity: 1; }

    @keyframes text-ret-1 {
        0%, 61.5% { opacity: 0; }
        62.5%, 100% { opacity: 1; }
    }
    .ret-1 { animation: text-ret-1 16.0s infinite; opacity: 0; }

    @keyframes appear-0 {
        0%, 36.5% { opacity: 0; }
        37.5%, 61.5% { opacity: 1; }
        62.5%, 100% { opacity: 0; }
    }
    .g-0 { animation: appear-0 16.0s infinite; opacity: 0; }

    @keyframes color-0 {
        0%, 49.0% { fill: #f8f9fa; stroke: #dee2e6; }
        50.0%, 100% { fill: #d4edda; stroke: #28a745; }
    }
    .rect-0 { animation: color-0 16.0s infinite; fill: #f8f9fa; stroke: #dee2e6; }

    @keyframes text-math-0 {
        0%, 49.0% { opacity: 1; }
        50.0%, 100% { opacity: 0; }
    }
    .math-0 { animation: text-math-0 16.0s infinite; opacity: 1; }

    @keyframes text-ret-0 {
        0%, 49.0% { opacity: 0; }
        50.0%, 100% { opacity: 1; }
    }
    .ret-0 { animation: text-ret-0 16.0s infinite; opacity: 0; }
</style>
<text x="300.0" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#212529">Call Stack Animado: factorial(3)</text>

<g class="g-3">
    <rect x="150.0" y="400" width="300" height="65" class="frame rect-3" />
    <text x="300.0" y="425" class="call-text" text-anchor="middle">factorial(3)</text>
    <text x="300.0" y="445" class="sub-text math-3" text-anchor="middle">3 × factorial(2)</text>
    <text x="300.0" y="445" class="ret-text ret-3" text-anchor="middle">return 3 × 2 = 6</text>
</g>

<g class="g-2">
    <rect x="150.0" y="320" width="300" height="65" class="frame rect-2" />
    <text x="300.0" y="345" class="call-text" text-anchor="middle">factorial(2)</text>
    <text x="300.0" y="365" class="sub-text math-2" text-anchor="middle">2 × factorial(1)</text>
    <text x="300.0" y="365" class="ret-text ret-2" text-anchor="middle">return 2 × 1 = 2</text>
</g>

<g class="g-1">
    <rect x="150.0" y="240" width="300" height="65" class="frame rect-1" />
    <text x="300.0" y="265" class="call-text" text-anchor="middle">factorial(1)</text>
    <text x="300.0" y="285" class="sub-text math-1" text-anchor="middle">1 × factorial(0)</text>
    <text x="300.0" y="285" class="ret-text ret-1" text-anchor="middle">return 1 × 1 = 1</text>
</g>

<g class="g-0">
    <rect x="150.0" y="160" width="300" height="65" class="frame rect-0" />
    <text x="300.0" y="185" class="call-text" text-anchor="middle">factorial(0)</text>
    <text x="300.0" y="205" class="sub-text math-0" text-anchor="middle">BASE CASE</text>
    <text x="300.0" y="205" class="ret-text ret-0" text-anchor="middle">return 1</text>
</g>
</svg>