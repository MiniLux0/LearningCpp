<svg width="600" height="350" xmlns="http://www.w3.org/2000/svg">
<rect width="600" height="350" fill="#ffffff" rx="10"/>
<style>
    text { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }
    .peg { fill: #dee2e6; rx: 4; }
    .base { fill: #ced4da; rx: 6; }
    .disk { stroke: #fff; stroke-width: 2; rx: 10; }

    @keyframes show-step-0 {
        0%, 0.0% { opacity: 0; }
        0.0%, 12.4% { opacity: 1; }
        12.5%, 100% { opacity: 0; }
    }
    .step-0 { animation: show-step-0 8.0s infinite; opacity: 0; }

    @keyframes show-step-1 {
        0%, 12.4% { opacity: 0; }
        12.5%, 24.9% { opacity: 1; }
        25.0%, 100% { opacity: 0; }
    }
    .step-1 { animation: show-step-1 8.0s infinite; opacity: 0; }

    @keyframes show-step-2 {
        0%, 24.9% { opacity: 0; }
        25.0%, 37.4% { opacity: 1; }
        37.5%, 100% { opacity: 0; }
    }
    .step-2 { animation: show-step-2 8.0s infinite; opacity: 0; }

    @keyframes show-step-3 {
        0%, 37.4% { opacity: 0; }
        37.5%, 49.9% { opacity: 1; }
        50.0%, 100% { opacity: 0; }
    }
    .step-3 { animation: show-step-3 8.0s infinite; opacity: 0; }

    @keyframes show-step-4 {
        0%, 49.9% { opacity: 0; }
        50.0%, 62.4% { opacity: 1; }
        62.5%, 100% { opacity: 0; }
