    @keyframes show-step-6 {
        0%, 74.9% { opacity: 0; }
        75.0%, 87.4% { opacity: 1; }
        87.5%, 100% { opacity: 0; }
    }
    .step-6 { animation: show-step-6 8.0s infinite; opacity: 0; }

    @keyframes show-step-7 {
        0%, 87.4% { opacity: 0; }
        87.5%, 99.9% { opacity: 1; }
        100.0%, 100% { opacity: 0; }
    }
    .step-7 { animation: show-step-7 8.0s infinite; opacity: 0; }
</style>
<text x="300.0" y="40" font-size="22" font-weight="bold" text-anchor="middle" fill="#212529">Torres de Hanói (N=3) Animado</text>
<g class="step-0">

