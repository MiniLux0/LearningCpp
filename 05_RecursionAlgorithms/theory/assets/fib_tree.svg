<svg width="700" height="350" xmlns="http://www.w3.org/2000/svg">
<rect width="700" height="350" fill="#ffffff" rx="10"/>
<style>
    text { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; font-size: 14px; font-weight: bold; }
    .node-box { fill: #e1f5fe; stroke: #0288d1; stroke-width: 2; rx: 6; }
    .node-leaf { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; rx: 6; }
    .edge { stroke: #adb5bd; stroke-width: 2; }
    
    @keyframes fadeIn {
        0% { opacity: 0; transform: scale(0.8); transform-origin: center; }
        100% { opacity: 1; transform: scale(1); transform-origin: center; }
    }
    .anim-item { opacity: 0; animation: fadeIn 0.5s forwards; }
</style>
<text x="350.0" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#212529">Árbol de Recursión Animado: fib(4)</text>
<g class="anim-item" style="animation-delay: 0.0s; transform-origin: 350px 50px;">
  <rect x="310" y="35" width="80" height="30" class="node-box"/>
  <text x="350" y="55" text-anchor="middle" fill="#212529">fib(4)</text>
</g>
<g class="anim-item" style="animation-delay: 0.8s; transform-origin: 200px 130px;">
  <line x1="350" y1="65" x2="200" y2="115" class="edge"/>
  <rect x="160" y="115" width="80" height="30" class="node-box"/>
  <text x="200" y="135" text-anchor="middle" fill="#212529">fib(3)</text>
</g>
<g class="anim-item" style="animation-delay: 1.6s; transform-origin: 100px 210px;">
  <line x1="200" y1="145" x2="100" y2="195" class="edge"/>
  <rect x="60" y="195" width="80" height="30" class="node-box"/>
  <text x="100" y="215" text-anchor="middle" fill="#212529">fib(2)</text>
</g>
<g class="anim-item" style="animation-delay: 2.4000000000000004s; transform-origin: 50px 290px;">
  <line x1="100" y1="225" x2="50" y2="275" class="edge"/>
  <rect x="10" y="275" width="80" height="30" class="node-leaf"/>
  <text x="50" y="295" text-anchor="middle" fill="#212529">fib(1)=1</text>
</g>
<g class="anim-item" style="animation-delay: 3.2s; transform-origin: 150px 290px;">
  <line x1="100" y1="225" x2="150" y2="275" class="edge"/>
  <rect x="110" y="275" width="80" height="30" class="node-leaf"/>
  <text x="150" y="295" text-anchor="middle" fill="#212529">fib(0)=0</text>
</g>
<g class="anim-item" style="animation-delay: 4.0s; transform-origin: 300px 210px;">
  <line x1="200" y1="145" x2="300" y2="195" class="edge"/>
  <rect x="260" y="195" width="80" height="30" class="node-leaf"/>
  <text x="300" y="215" text-anchor="middle" fill="#212529">fib(1)=1</text>
</g>
<g class="anim-item" style="animation-delay: 4.800000000000001s; transform-origin: 500px 130px;">
  <line x1="350" y1="65" x2="500" y2="115" class="edge"/>
  <rect x="460" y="115" width="80" height="30" class="node-box"/>
  <text x="500" y="135" text-anchor="middle" fill="#212529">fib(2)</text>
</g>
<g class="anim-item" style="animation-delay: 5.6000000000000005s; transform-origin: 420px 210px;">
  <line x1="500" y1="145" x2="420" y2="195" class="edge"/>
  <rect x="380" y="195" width="80" height="30" class="node-leaf"/>
  <text x="420" y="215" text-anchor="middle" fill="#212529">fib(1)=1</text>
</g>
<g class="anim-item" style="animation-delay: 6.4s; transform-origin: 580px 210px;">
  <line x1="500" y1="145" x2="580" y2="195" class="edge"/>
  <rect x="540" y="195" width="80" height="30" class="node-leaf"/>
  <text x="580" y="215" text-anchor="middle" fill="#212529">fib(0)=0</text>
</g>
</svg>