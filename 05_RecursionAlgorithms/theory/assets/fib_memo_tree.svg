<svg width="600" height="350" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" />
<style>
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #343a40; }
