<svg width="800" height="160" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" />
<style>
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #343a40; }
  .text { font-family: sans-serif; font-size: 13px; fill: #212529; }
  .mono { font-family: monospace; font-size: 12px; fill: #e63946; font-weight: bold; }
  .box { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
  .box-blue { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
  .box-green { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
</style>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#e63946"/>
    </marker>
</defs>
<text class="title" x="30" y="30">C++ Stream I/O Architecture</text>
    <rect x="30" y="60" width="120" height="60" rx="6" class="box"/>
    <text x="90.0" y="85" class="text" font-weight="bold" text-anchor="middle">[User Keyboard]</text>
    <text x="90.0" y="105" class="mono" text-anchor="middle">Input</text>
    
    <rect x="220" y="60" width="140" height="60" rx="6" class="box-blue"/>
    <text x="290.0" y="85" class="text" font-weight="bold" text-anchor="middle">std::cin</text>
    <text x="290.0" y="105" class="mono" text-anchor="middle">Stream Buffer</text>
    
    <rect x="430" y="60" width="140" height="60" rx="6" class="box-green"/>
    <text x="500.0" y="85" class="text" font-weight="bold" text-anchor="middle">Variable in RAM</text>
    <text x="500.0" y="105" class="mono" text-anchor="middle">int, string</text>
    
    <rect x="640" y="60" width="120" height="60" rx="6" class="box-blue"/>
    <text x="700.0" y="85" class="text" font-weight="bold" text-anchor="middle">std::cout</text>
    <text x="700.0" y="105" class="mono" text-anchor="middle">Console Screen</text>
    <line x1="150" y1="90" x2="220" y2="90" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/><text x="185.0" y="80.0" class="text" font-size="11" text-anchor="middle" fill="#6c757d">Keystrokes</text><line x1="360" y1="90" x2="430" y2="90" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/><text x="395.0" y="80.0" class="text" font-size="11" text-anchor="middle" fill="#6c757d">>> (Extract)</text><line x1="570" y1="90" x2="640" y2="90" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/><text x="605.0" y="80.0" class="text" font-size="11" text-anchor="middle" fill="#6c757d"><< (Insert)</text>
</svg>