<svg width="400" height="450" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" />
<style>
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #343a40; }
  .text { font-family: sans-serif; font-size: 13px; fill: #212529; }
  .mono { font-family: monospace; font-size: 12px; fill: #e63946; font-weight: bold; }
  .box { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
  .box-blue { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
  .box-green { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
</style>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#e63946"/>
    </marker>
</defs>
<text class="title" x="200" y="30" text-anchor="middle">Interactive Profile App Flow</text>
    <rect x="100" y="60" width="200" height="40" rx="6" class="box-green"/>
    <text x="200.0" y="85" class="text" font-weight="bold" text-anchor="middle">Program Launch</text>
    <text x="200.0" y="105" class="mono" text-anchor="middle"></text>
    <line x1="200" y1="100" x2="200" y2="120" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="100" y="120" width="200" height="40" rx="6" class="box"/>
    <text x="200.0" y="145" class="text" font-weight="bold" text-anchor="middle">Print ASCII Banner Header</text>
    <text x="200.0" y="165" class="mono" text-anchor="middle">std::cout</text>
    <line x1="200" y1="160" x2="200" y2="180" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="100" y="180" width="200" height="40" rx="6" class="box-blue"/>
    <text x="200.0" y="205" class="text" font-weight="bold" text-anchor="middle">Prompt & Extract Name</text>
    <text x="200.0" y="225" class="mono" text-anchor="middle">std::string</text>
    <line x1="200" y1="220" x2="200" y2="240" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="100" y="240" width="200" height="40" rx="6" class="box-blue"/>
    <text x="200.0" y="265" class="text" font-weight="bold" text-anchor="middle">Prompt & Extract Subject</text>
    <text x="200.0" y="285" class="mono" text-anchor="middle">std::string</text>
    <line x1="200" y1="280" x2="200" y2="300" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="100" y="300" width="200" height="40" rx="6" class="box-blue"/>
    <text x="200.0" y="325" class="text" font-weight="bold" text-anchor="middle">Prompt & Extract Lucky Number</text>
    <text x="200.0" y="345" class="mono" text-anchor="middle">int</text>
    <line x1="200" y1="340" x2="200" y2="360" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="100" y="360" width="200" height="40" rx="6" class="box"/>
    <text x="200.0" y="385" class="text" font-weight="bold" text-anchor="middle">Format & Render Profile Card</text>
    <text x="200.0" y="405" class="mono" text-anchor="middle"></text>
    <line x1="200" y1="400" x2="200" y2="420" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="100" y="420" width="200" height="40" rx="6" class="box-green"/>
    <text x="200.0" y="445" class="text" font-weight="bold" text-anchor="middle">Return 0 (Success)</text>
    <text x="200.0" y="465" class="mono" text-anchor="middle"></text>
    
</svg>