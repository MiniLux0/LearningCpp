<svg width="750" height="200" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" />
<style>
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #343a40; }
  .text { font-family: sans-serif; font-size: 13px; fill: #212529; }
  .mono { font-family: monospace; font-size: 12px; fill: #e63946; font-weight: bold; }
  .box { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
  .box-blue { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
  .box-green { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
</style>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#e63946"/>
    </marker>
</defs>
<text class="title" x="30" y="30">I/O Buffer Flushing: \n vs std::endl</text>
    <rect x="30" y="60" width="200" height="40" rx="6" class="box"/>
    <text x="130.0" y="85" class="text" font-weight="bold" text-anchor="middle">std::cout << 'Text\n'</text>
    <text x="130.0" y="105" class="mono" text-anchor="middle"></text>
    
    <rect x="30" y="130" width="200" height="40" rx="6" class="box"/>
    <text x="130.0" y="155" class="text" font-weight="bold" text-anchor="middle">std::cout << std::endl</text>
    <text x="130.0" y="175" class="mono" text-anchor="middle"></text>
    
    <rect x="350" y="95" width="140" height="40" rx="6" class="box-blue"/>
    <text x="420.0" y="120" class="text" font-weight="bold" text-anchor="middle">RAM I/O Buffer</text>
    <text x="420.0" y="140" class="mono" text-anchor="middle">Pending Output</text>
    
    <rect x="580" y="95" width="140" height="40" rx="6" class="box-green"/>
    <text x="650.0" y="120" class="text" font-weight="bold" text-anchor="middle">OS Console</text>
    <text x="650.0" y="140" class="mono" text-anchor="middle">Screen</text>
    <line x1="230" y1="80" x2="350" y2="110" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/><text x="290.0" y="85.0" class="text" font-size="11" text-anchor="middle" fill="#6c757d">Fast (Write to RAM)</text><line x1="230" y1="150" x2="350" y2="120" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/><text x="290.0" y="125.0" class="text" font-size="11" text-anchor="middle" fill="#6c757d">Slower (Write to RAM)</text><line x1="490" y1="115" x2="580" y2="115" stroke="#e63946" stroke-width="2" marker-end="url(#arrow-red)"/><text x="535.0" y="105.0" class="text" font-size="11" text-anchor="middle" fill="#6c757d">Forced Flush</text>
</svg>