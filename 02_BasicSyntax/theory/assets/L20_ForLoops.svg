<svg width="550" height="230" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" />
<style>
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #343a40; }
  .text { font-family: sans-serif; font-size: 13px; fill: #212529; }
  .mono { font-family: monospace; font-size: 12px; fill: #e63946; font-weight: bold; }
  .box { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
  .box-blue { fill: #e1f5fe; stroke: #0288d1; stroke-width: 2; }
  .box-green { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
  .box-orange { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
  .box-red { fill: #ffebee; stroke: #d32f2f; stroke-width: 2; }
  .diamond { fill: #fff8e1; stroke: #ffb300; stroke-width: 2; }
</style>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f"/>
    </marker>
</defs>
<text class="title" x="30" y="30">For Loop Pipeline</text>
<rect x="30" y="60" width="120" height="50" rx="8" class="box-blue"/>
<text x="90.0" y="79.0" class="text" font-weight="bold" text-anchor="middle">1. Init</text>
<text x="90.0" y="99.0" class="mono" text-anchor="middle">int i = 0</text>
<line x1="150" y1="85" x2="200" y2="85" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="270.0,55 340,85.0 270.0,115 200,85.0" class="diamond"/>
<text x="270.0" y="89.0" class="text" font-weight="bold" text-anchor="middle">2. Cond: i < 5</text>
<line x1="270" y1="115" x2="270" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="270.0" y="129.5" class="text" font-size="11" text-anchor="middle" fill="#388e3c">True</text>
<rect x="200" y="160" width="140" height="40" rx="8" class="box-green"/>
<text x="270.0" y="184.0" class="text" font-weight="bold" text-anchor="middle">3. Execute Body</text>
<line x1="200" y1="180" x2="130" y2="180" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="160" width="100" height="40" rx="8" class="box-orange"/>
<text x="80.0" y="174.0" class="text" font-weight="bold" text-anchor="middle">4. Step</text>
<text x="80.0" y="194.0" class="mono" text-anchor="middle">i++</text>
<path d="M 80 160 L 80 130 L 220 130 L 220 105" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="340" y1="85" x2="410" y2="85" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow-red)"/>
<text x="375.0" y="77.0" class="text" font-size="11" text-anchor="middle" fill="#d32f2f">False</text>
<rect x="410" y="65" width="100" height="40" rx="8" class="box"/>
<text x="460.0" y="89.0" class="text" font-weight="bold" text-anchor="middle">Exit Loop</text>

</svg>