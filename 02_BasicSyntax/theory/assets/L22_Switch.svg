<svg width="420" height="270" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" />
<style>
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #343a40; }
  .text { font-family: sans-serif; font-size: 13px; fill: #212529; }
  .mono { font-family: monospace; font-size: 12px; fill: #e63946; font-weight: bold; }
  .box { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
  .box-blue { fill: #e1f5fe; stroke: #0288d1; stroke-width: 2; }
  .box-green { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
  .box-orange { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
  .box-red { fill: #ffebee; stroke: #d32f2f; stroke-width: 2; }
  .diamond { fill: #fff8e1; stroke: #ffb300; stroke-width: 2; }
</style>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f"/>
    </marker>
</defs>
<text class="title" x="50" y="30">Switch Statement (Jump Table)</text>
<rect x="150" y="50" width="100" height="40" rx="8" class="box-blue"/>
<text x="200.0" y="74.0" class="text" font-weight="bold" text-anchor="middle">switch (val)</text>
<line x1="200" y1="90" x2="200" y2="120" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="200.0,120 280,150.0 200.0,180 120,150.0" class="diamond"/>
<text x="200.0" y="154.0" class="text" font-weight="bold" text-anchor="middle">Jump Table Index</text>
<line x1="120" y1="150" x2="50" y2="200" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
<text x="85.0" y="167.0" class="text" font-size="11" text-anchor="middle" fill="#adb5bd">case 1</text>
<rect x="10" y="200" width="100" height="40" rx="8" class="box"/>
<text x="60.0" y="224.0" class="text" font-weight="bold" text-anchor="middle">Block 1</text>
<line x1="200" y1="180" x2="200" y2="200" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
<text x="200.0" y="182.0" class="text" font-size="11" text-anchor="middle" fill="#adb5bd">case 2</text>
<rect x="150" y="200" width="100" height="40" rx="8" class="box"/>
<text x="200.0" y="224.0" class="text" font-weight="bold" text-anchor="middle">Block 2</text>
<line x1="280" y1="150" x2="350" y2="200" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
<text x="315.0" y="167.0" class="text" font-size="11" text-anchor="middle" fill="#adb5bd">default</text>
<rect x="290" y="200" width="100" height="40" rx="8" class="box-orange"/>
<text x="340.0" y="224.0" class="text" font-weight="bold" text-anchor="middle">Default Block</text>

</svg>