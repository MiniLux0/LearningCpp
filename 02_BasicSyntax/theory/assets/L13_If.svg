<svg width="350" height="380" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" />
<style>
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #343a40; }
  .text { font-family: sans-serif; font-size: 13px; fill: #212529; }
  .mono { font-family: monospace; font-size: 12px; fill: #e63946; font-weight: bold; }
  .box { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
  .box-blue { fill: #e1f5fe; stroke: #0288d1; stroke-width: 2; }
  .box-green { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
  .box-orange { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
  .box-red { fill: #ffebee; stroke: #d32f2f; stroke-width: 2; }
  .diamond { fill: #fff8e1; stroke: #ffb300; stroke-width: 2; }
</style>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f"/>
    </marker>
</defs>
<text class="title" x="50" y="30">If Statement Control Flow</text>
<rect x="150" y="50" width="100" height="40" rx="8" class="box"/>
<text x="200.0" y="74.0" class="text" font-weight="bold" text-anchor="middle">Program Flow</text>
<line x1="200" y1="90" x2="200" y2="120" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
<polygon points="200.0,120 280,150.0 200.0,180 120,150.0" class="diamond"/>
<text x="200.0" y="154.0" class="text" font-weight="bold" text-anchor="middle">Condition == true?</text>
<line x1="200" y1="180" x2="200" y2="220" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="200.0" y="192.0" class="text" font-size="11" text-anchor="middle" fill="#388e3c">Yes (true)</text>
<rect x="130" y="220" width="140" height="40" rx="8" class="box-green"/>
<text x="200.0" y="244.0" class="text" font-weight="bold" text-anchor="middle">Execute Block { }</text>
<line x1="200" y1="260" x2="200" y2="300" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 120 150 L 50 150 L 50 280 L 180 280" fill="none" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow-red)"/>
<text x="85" y="140" class="text" font-size="11" text-anchor="middle" fill="#d32f2f">No (false)</text>
<rect x="130" y="300" width="140" height="40" rx="8" class="box"/>
<text x="200.0" y="324.0" class="text" font-weight="bold" text-anchor="middle">Continue Execution</text>

</svg>