<svg width="500" height="300" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" />
<style>
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #343a40; }
  .text { font-family: sans-serif; font-size: 13px; fill: #212529; }
  .mono { font-family: monospace; font-size: 12px; fill: #e63946; font-weight: bold; }
  .box { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
  .box-blue { fill: #e1f5fe; stroke: #0288d1; stroke-width: 2; }
  .box-green { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
  .box-orange { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
  .box-red { fill: #ffebee; stroke: #d32f2f; stroke-width: 2; }
  .diamond { fill: #fff8e1; stroke: #ffb300; stroke-width: 2; }
</style>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f"/>
    </marker>
</defs>
<text class="title" x="50" y="30">If-ElseIf-Else Ladder</text>
<polygon points="200.0,50 280,80.0 200.0,110 120,80.0" class="diamond"/>
<text x="200.0" y="84.0" class="text" font-weight="bold" text-anchor="middle">score >= 90?</text>
<line x1="280" y1="80" x2="320" y2="80" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="300.0" y="72.0" class="text" font-size="11" text-anchor="middle" fill="#388e3c">Yes</text>
<rect x="320" y="60" width="100" height="40" rx="8" class="box-green"/>
<text x="370.0" y="84.0" class="text" font-weight="bold" text-anchor="middle">Grade = A</text>
<line x1="200" y1="110" x2="200" y2="140" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow-red)"/>
<text x="200.0" y="117.0" class="text" font-size="11" text-anchor="middle" fill="#d32f2f">No</text>
<polygon points="200.0,140 280,170.0 200.0,200 120,170.0" class="diamond"/>
<text x="200.0" y="174.0" class="text" font-weight="bold" text-anchor="middle">score >= 80?</text>
<line x1="280" y1="170" x2="320" y2="170" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="300.0" y="162.0" class="text" font-size="11" text-anchor="middle" fill="#388e3c">Yes</text>
<rect x="320" y="150" width="100" height="40" rx="8" class="box-green"/>
<text x="370.0" y="174.0" class="text" font-weight="bold" text-anchor="middle">Grade = B</text>
<line x1="200" y1="200" x2="200" y2="230" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow-red)"/>
<text x="200.0" y="207.0" class="text" font-size="11" text-anchor="middle" fill="#d32f2f">No</text>
<rect x="150" y="230" width="100" height="40" rx="8" class="box-orange"/>
<text x="200.0" y="254.0" class="text" font-weight="bold" text-anchor="middle">Grade = C</text>

</svg>