<svg width="420" height="200" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" />
<style>
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #343a40; }
  .text { font-family: sans-serif; font-size: 13px; fill: #212529; }
  .mono { font-family: monospace; font-size: 12px; fill: #e63946; font-weight: bold; }
  .box { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
  .box-blue { fill: #e1f5fe; stroke: #0288d1; stroke-width: 2; }
  .box-green { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
  .box-orange { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
  .box-red { fill: #ffebee; stroke: #d32f2f; stroke-width: 2; }
  .diamond { fill: #fff8e1; stroke: #ffb300; stroke-width: 2; }
</style>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f"/>
    </marker>
</defs>
<text class="title" x="30" y="30">Bitwise Operations</text>
<rect x="30" y="50" width="140" height="40" rx="8" class="box-blue"/>
<text x="100.0" y="74.0" class="text" font-weight="bold" text-anchor="middle">a = 12 (1100)</text>
<rect x="200" y="50" width="140" height="40" rx="8" class="box-blue"/>
<text x="270.0" y="74.0" class="text" font-weight="bold" text-anchor="middle">b = 5 (0101)</text>
<line x1="100" y1="90" x2="100" y2="130" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="270" y1="90" x2="100" y2="130" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="130" width="160" height="40" rx="8" class="box-green"/>
<text x="110.0" y="154.0" class="text" font-weight="bold" text-anchor="middle">a & b = 4 (0100)</text>
<line x1="120" y1="90" x2="280" y2="130" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="270" y1="90" x2="280" y2="130" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="210" y="130" width="160" height="40" rx="8" class="box-orange"/>
<text x="290.0" y="154.0" class="text" font-weight="bold" text-anchor="middle">a | b = 13 (1101)</text>

</svg>