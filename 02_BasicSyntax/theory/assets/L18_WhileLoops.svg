<svg width="400" height="350" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" />
<style>
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #343a40; }
  .text { font-family: sans-serif; font-size: 13px; fill: #212529; }
  .mono { font-family: monospace; font-size: 12px; fill: #e63946; font-weight: bold; }
  .box { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
  .box-blue { fill: #e1f5fe; stroke: #0288d1; stroke-width: 2; }
  .box-green { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
  .box-orange { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
  .box-red { fill: #ffebee; stroke: #d32f2f; stroke-width: 2; }
  .diamond { fill: #fff8e1; stroke: #ffb300; stroke-width: 2; }
</style>
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#388e3c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f"/>
    </marker>
</defs>
<text class="title" x="50" y="30">While Loop Execution</text>
<polygon points="200.0,60 280,90.0 200.0,120 120,90.0" class="diamond"/>
<text x="200.0" y="94.0" class="text" font-weight="bold" text-anchor="middle">Condition == true?</text>
<line x1="200" y1="120" x2="200" y2="160" stroke="#388e3c" stroke-width="2" marker-end="url(#arrow-green)"/>
<text x="200.0" y="132.0" class="text" font-size="11" text-anchor="middle" fill="#388e3c">True</text>
<rect x="120" y="160" width="160" height="40" rx="8" class="box-green"/>
<text x="200.0" y="184.0" class="text" font-weight="bold" text-anchor="middle">Execute Body { }</text>
<path d="M 120 180 L 50 180 L 50 90 L 110 90" fill="none" stroke="#0288d1" stroke-width="2" marker-end="url(#arrow)"/>
<text x="85" y="170" class="text" font-size="11" text-anchor="middle" fill="#0288d1">Loop Back</text>
<path d="M 280 90 L 350 90 L 350 250 L 220 250" fill="none" stroke="#d32f2f" stroke-width="2" marker-end="url(#arrow-red)"/>
<text x="315" y="80" class="text" font-size="11" text-anchor="middle" fill="#d32f2f">False</text>
<rect x="130" y="270" width="140" height="40" rx="8" class="box"/>
<text x="200.0" y="294.0" class="text" font-weight="bold" text-anchor="middle">Exit Loop</text>

</svg>