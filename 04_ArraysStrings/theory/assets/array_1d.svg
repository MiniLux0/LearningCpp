<svg width="600" height="180" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" />
<style>
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #343a40; }
  .text { font-family: sans-serif; font-size: 14px; fill: #212529; }
  .mono { font-family: monospace; font-size: 13px; fill: #e63946; }
  .addr { font-family: monospace; font-size: 12px; fill: #6c757d; }
  .box { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
  .box-ref { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
</style>

    <text class="title" x="50" y="40">1D Array Contiguous Memory (int: 4 bytes)</text>
    
        <rect class="box" x="50" y="80" width="100" height="60" rx="4"/>
        <text class="addr" x="100" y="70" text-anchor="middle">0x1000</text>
        <text class="mono" x="100" y="105" text-anchor="middle">arr[0]</text>
        <text class="text" x="100" y="125" text-anchor="middle" font-weight="bold">10</text>
        <line x1="150" y1="110" x2="170" y2="110" stroke="#adb5bd" stroke-width="2"/>
        <rect class="box" x="170" y="80" width="100" height="60" rx="4"/>
        <text class="addr" x="220" y="70" text-anchor="middle">0x1004</text>
        <text class="mono" x="220" y="105" text-anchor="middle">arr[1]</text>
        <text class="text" x="220" y="125" text-anchor="middle" font-weight="bold">20</text>
        <line x1="270" y1="110" x2="290" y2="110" stroke="#adb5bd" stroke-width="2"/>
        <rect class="box" x="290" y="80" width="100" height="60" rx="4"/>
        <text class="addr" x="340" y="70" text-anchor="middle">0x1008</text>
        <text class="mono" x="340" y="105" text-anchor="middle">arr[2]</text>
        <text class="text" x="340" y="125" text-anchor="middle" font-weight="bold">30</text>
        <line x1="390" y1="110" x2="410" y2="110" stroke="#adb5bd" stroke-width="2"/>
        <rect class="box" x="410" y="80" width="100" height="60" rx="4"/>
        <text class="addr" x="460" y="70" text-anchor="middle">0x100C</text>
        <text class="mono" x="460" y="105" text-anchor="middle">arr[3]</text>
        <text class="text" x="460" y="125" text-anchor="middle" font-weight="bold">40</text>
        
    
</svg>