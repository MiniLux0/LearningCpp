<svg width="600" height="260" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" />
<style>
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #343a40; }
  .text { font-family: sans-serif; font-size: 14px; fill: #212529; }
  .mono { font-family: monospace; font-size: 13px; fill: #e63946; }
  .addr { font-family: monospace; font-size: 12px; fill: #6c757d; }
  .box { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
  .box-ref { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
</style>

    <text class="title" x="50" y="40">C-String Memory Layout (char array)</text>
    
        <rect x="50" y="80" width="60" height="60" rx="4" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
        <text class="addr" x="80" y="70" text-anchor="middle">idx 0</text>
        <text class="text" x="80" y="110" text-anchor="middle" font-weight="bold" font-size="20">'H'</text>
        
        <rect x="120" y="80" width="60" height="60" rx="4" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
        <text class="addr" x="150" y="70" text-anchor="middle">idx 1</text>
        <text class="text" x="150" y="110" text-anchor="middle" font-weight="bold" font-size="20">'e'</text>
        
        <rect x="190" y="80" width="60" height="60" rx="4" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
        <text class="addr" x="220" y="70" text-anchor="middle">idx 2</text>
        <text class="text" x="220" y="110" text-anchor="middle" font-weight="bold" font-size="20">'l'</text>
        
        <rect x="260" y="80" width="60" height="60" rx="4" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
        <text class="addr" x="290" y="70" text-anchor="middle">idx 3</text>
        <text class="text" x="290" y="110" text-anchor="middle" font-weight="bold" font-size="20">'l'</text>
        
        <rect x="330" y="80" width="60" height="60" rx="4" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
        <text class="addr" x="360" y="70" text-anchor="middle">idx 4</text>
        <text class="text" x="360" y="110" text-anchor="middle" font-weight="bold" font-size="20">'o'</text>
        
        <rect x="400" y="80" width="60" height="60" rx="4" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
        <text class="addr" x="430" y="70" text-anchor="middle">idx 5</text>
        <text class="text" x="430" y="110" text-anchor="middle" font-weight="bold" font-size="20">'!'</text>
        
        <rect x="470" y="80" width="60" height="60" rx="4" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
        <text class="addr" x="500" y="70" text-anchor="middle">idx 6</text>
        <text class="text" x="500" y="110" text-anchor="middle" font-weight="bold" font-size="20">'\0'</text>
        
    <path d="M 50 160 L 50 170 L 400 170 L 400 160" fill="none" stroke="#1976d2" stroke-width="2"/>
    <text class="text" x="225" y="190" text-anchor="middle" fill="#1976d2">Useful Length (strlen) = 6</text>
    
    <path d="M 50 200 L 50 210 L 470 210 L 470 200" fill="none" stroke="#e53935" stroke-width="2"/>
    <text class="text" x="260" y="230" text-anchor="middle" fill="#e53935">Physically Allocated Capacity = 7 bytes (Includes Null Terminator)</text>
    
</svg>