<svg width="700" height="180" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" fill="#ffffff" />
<style>
  .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #343a40; }
  .text { font-family: sans-serif; font-size: 14px; fill: #212529; }
  .mono { font-family: monospace; font-size: 13px; fill: #e63946; }
  .addr { font-family: monospace; font-size: 12px; fill: #6c757d; }
  .box { fill: #f8f9fa; stroke: #adb5bd; stroke-width: 2; }
  .box-ref { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
</style>

    <text class="title" x="50" y="40">2D Matrix Row-Major Order Flattening (2x3)</text>
    <rect x="50" y="50" width="290" height="20" fill="#7cb342" rx="4"/>
    <text class="text" x="195" y="65" text-anchor="middle" fill="white" font-weight="bold">Row 0</text>
    <rect x="350" y="50" width="290" height="20" fill="#fb8c00" rx="4"/>
    <text class="text" x="495" y="65" text-anchor="middle" fill="white" font-weight="bold">Row 1</text>
    
        <rect x="50" y="80" width="90" height="60" rx="4" fill="#f1f8e9" stroke="#7cb342" stroke-width="2"/>
        <text class="mono" x="95" y="105" text-anchor="middle">mat[0][0]</text>
        <text class="addr" x="95" y="125" text-anchor="middle">Index: 0</text>
        <line x1="140" y1="110" x2="150" y2="110" stroke="#adb5bd" stroke-width="2"/>
        <rect x="150" y="80" width="90" height="60" rx="4" fill="#f1f8e9" stroke="#7cb342" stroke-width="2"/>
        <text class="mono" x="195" y="105" text-anchor="middle">mat[0][1]</text>
        <text class="addr" x="195" y="125" text-anchor="middle">Index: 1</text>
        <line x1="240" y1="110" x2="250" y2="110" stroke="#adb5bd" stroke-width="2"/>
        <rect x="250" y="80" width="90" height="60" rx="4" fill="#f1f8e9" stroke="#7cb342" stroke-width="2"/>
        <text class="mono" x="295" y="105" text-anchor="middle">mat[0][2]</text>
        <text class="addr" x="295" y="125" text-anchor="middle">Index: 2</text>
        <line x1="340" y1="110" x2="350" y2="110" stroke="#adb5bd" stroke-width="2"/>
        <rect x="350" y="80" width="90" height="60" rx="4" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
        <text class="mono" x="395" y="105" text-anchor="middle">mat[1][0]</text>
        <text class="addr" x="395" y="125" text-anchor="middle">Index: 3</text>
        <line x1="440" y1="110" x2="450" y2="110" stroke="#adb5bd" stroke-width="2"/>
        <rect x="450" y="80" width="90" height="60" rx="4" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
        <text class="mono" x="495" y="105" text-anchor="middle">mat[1][1]</text>
        <text class="addr" x="495" y="125" text-anchor="middle">Index: 4</text>
        <line x1="540" y1="110" x2="550" y2="110" stroke="#adb5bd" stroke-width="2"/>
        <rect x="550" y="80" width="90" height="60" rx="4" fill="#fff3e0" stroke="#fb8c00" stroke-width="2"/>
        <text class="mono" x="595" y="105" text-anchor="middle">mat[1][2]</text>
        <text class="addr" x="595" y="125" text-anchor="middle">Index: 5</text>
        
    
</svg>